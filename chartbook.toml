[project]
name = "WRDS CRSP-Compustat"
description = "CRSP stock returns and Fama-French factor replication from WRDS CRSP and Compustat databases"
contributors = [
    "Jeremy Bejarano",
    "Tobias Rodriguez del Pozo",
]
repo_url = "https://github.com/ftsfr/wrds_crsp_compustat"
copyright = "2025"
os_compatibility = [
    "Windows",
    "Linux",
    "MacOS",
]
requires_chartbook = ">=0.5.0"

[scripts]
build = "doit"

[notebooks.summary_crsp_compustat]
name = "summary_crsp_compustat"
description = "Summary statistics and visualization of CRSP stock returns and Fama-French factors"
path = "_output/_notebook_build/summary_crsp_compustat_ipynb.ipynb"
publishable = true

[dataframes.ftsfr_CRSP_monthly_stock_ret]
name = "ftsfr_CRSP_monthly_stock_ret"
description = "CRSP monthly stock returns (including dividends) in long format"
sources = [
    "CRSP",
]
providers = [
    "WRDS",
]
contact_required = [
    "no",
]
pre_approved = [
    "No",
]
provider_links = [
    "https://wrds-www.wharton.upenn.edu/",
]
tags = [
    "stocks",
    "returns",
    "CRSP",
]
access_types = [
    "WRDS Subscription",
]
license = "WRDS"
restrictions = "No"
pull_method = "Pulled from WRDS CRSP database"
path = "./_data/ftsfr_CRSP_monthly_stock_ret.parquet"
date_col = "ds"
docs = """
## CRSP Monthly Stock Returns

Monthly stock returns from CRSP (including dividends).

### Columns

| Column | Description |
|--------|-------------|
| unique_id | CRSP PERMNO (permanent security identifier) |
| ds | Month-end date |
| y | Monthly return (including dividends) |

### Data Source

CRSP Monthly Stock File via WRDS (CIZ format)

### Universe

- Common stocks (securitysubtype='COM')
- U.S. incorporated companies (usincflg='Y')
- NYSE, AMEX, NASDAQ exchanges
"""

[dataframes.ftsfr_CRSP_monthly_stock_retx]
name = "ftsfr_CRSP_monthly_stock_retx"
description = "CRSP monthly stock returns (excluding dividends) in long format"
sources = [
    "CRSP",
]
providers = [
    "WRDS",
]
contact_required = [
