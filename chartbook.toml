"""

[dataframes.crsp_monthly_stock]
name = "crsp_monthly_stock"
description = "CRSP monthly stock file (CIZ format): returns, prices, and shares outstanding for the full msf_v2 universe"
sources = [
    "CRSP",
]
providers = [
    "WRDS",
]
contact_required = [
    "no",
]
pre_approved = [
    "No",
]
provider_links = [
    "https://wrds-www.wharton.upenn.edu/",
]
tags = [
    "stocks",
    "returns",
    "prices",
    "CRSP",
]
access_types = [
    "WRDS Subscription",
]
license = "WRDS"
restrictions = "No"
pull_method = "Pulled from WRDS CRSP database"
path = "./_data/CRSP_stock_ciz.parquet"
date_col = "mthcaldt"
docs = """
## CRSP Monthly Stock File (CIZ format)

The full CRSP monthly stock file (`crsp.msf_v2`), unfiltered. Downstream
consumers should filter the universe themselves (e.g.,
`securitytype == 'EQTY'` for a broad equity universe, or add
`securitysubtype == 'COM'` and `usincflg == 'Y'` for U.S. common stocks).

### Key columns

| Column | Description |
|--------|-------------|
| permno | CRSP permanent security identifier |
| mthcaldt | Month-end calendar date |
| mthret | Monthly return (including dividends, delisting-adjusted) |
| mthretx | Monthly return (excluding dividends) |
| shrout | Shares outstanding (thousands) |
| mthprc | Month-end price |
| securitytype, securitysubtype, sharetype, usincflg, issuertype | Universe filter fields |

Market capitalization can be computed as `shrout * abs(mthprc)`.

### Data Source

CRSP Monthly Stock File via WRDS (CIZ format, Flat File Format 2.0)
"""

[charts.crsp_returns_replication]
name = "CRSP Monthly Stock Returns"
description = "CRSP monthly stock returns for Fama-French 1993 factor replication"
dataframe = "ftsfr_CRSP_monthly_stock_ret"
path = "./_output/crsp_returns_replication.html"
tags = [
    "stocks",
    "returns",
    "CRSP",
    "fama-french",
    "replication",
]
publications = [
    "Fama and French (1993) - Common risk factors in the returns on stocks and bonds",
]
docs = """
## CRSP Monthly Stock Returns

Monthly stock returns from CRSP for Fama-French factor construction.

### Data Source

CRSP Monthly Stock File via WRDS

### Reference

Fama and French (1993) factor methodology
"""

[charts.crsp_cumulative_returns]
name = "CRSP Monthly Stock Cumulative Returns"
description = "Cumulative returns showing growth of $1 invested in CRSP stocks"
dataframe = "ftsfr_CRSP_monthly_stock_ret"
path = "./_output/crsp_cumulative_returns.html"
tags = [
    "stocks",
    "cumulative returns",
    "CRSP",
    "fama-french",
]
publications = [
    "Fama and French (1993) - Common risk factors in the returns on stocks and bonds",
]
docs = """
## CRSP Monthly Stock Cumulative Returns

Cumulative returns showing growth of $1 invested in CRSP stocks for Fama-French factor construction.

### Calculation

Cumulative return = Product of (1 + monthly return) over time

### Data Source

CRSP Monthly Stock File via WRDS
"""
